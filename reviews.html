<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cavi Consumes Coffee</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet">
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lato-font/3.0.0/css/lato-font.css" integrity="sha512-DdjGGRLdxZPin6QfSJ0dhPPTvyFzCvNl7jhl/AKMa3oyfUmelLEFLXi9thQWf3ynI9q/ehTcVPb+o1z8oo5ydg==" crossorigin="anonymous" referrerpolicy="no-referrer">
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="images/ccclogo.png" type="image/png">
        <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
        />
    </head>
    <body>
        <nav class="navbar"> <!--nav.navbar-->
            <div class="container">
                <div class="logo">
                    <a href="index.html">
                        <img src="images/ccclogo.png" alt="logo"> <!--img-->
                        <span class="site-title">Cavi Consumes Coffee</span>
                    </a>
                </div>

                <div class="main-menu"><!--.main-menu-->
                    <ul>
                        <li>
                            <a href="index.html">Home</a>
                        </li>
                        <li>
                            <a href="map.html">Map</a>
                        </li>
                                            
                        <li>
                            <a href="reviews.html">Reviews</a>
                        </li>   
                    </ul>
                </div>
                <!---hamburger button-->
                <button class="hamburger-button">
                    <div class="hamburger-line"></div>
                    <div class="hamburger-line"></div>
                    <div class="hamburger-line"></div>
                </button> 

                <!--mobile menu-->
                <div class="mobile-menu">
                    <ul>
                        <li>
                            <a href="index.html">Home</a>
                        </li>
                        <li>
                            <a href="map.html">Map</a>
                        </li>
                                            
                        <li>
                            <a href="reviews.html">Reviews</a>
                        </li>                 
                    </ul>                    
                </div>
            </div>
        </nav>
        <section class="reviews">
            <div class="container">
                <h1 class="text-xl">My Cafe Reviews</h1>
                <form id= "cafe-form" class="card bg-lightish cafe-form">
                    <h2 class="text-md">Add a cafe</h2>

                    <label for="cafe-name">Cafe Name</label> <!---connects label to the matching id-->
                    <input type="text" id="cafe-name" required>

                    <label for="cafe-drink">What I ordered</label>
                    <input type="text" id="cafe-drink">

                    <div class="form-row">
                        <div>
                            <label for="cafe-status">Status</label>
                            <select id="cafe-status">
                                <option value="visited">Visited</option>
                                <option value="wishlist">Wishlist</option>
                            </select>
                        </div>
                        <div>
                            <label for="cafe-rating">Rating</label>
                            <select id="cafe-rating">
                                <option value="0">not rated</option>
                                <option value="1">1 star</option>
                                <option value="2">2 star</option>
                                <option value="3">3 star</option>
                                <option value="4">4 star</option>
                                <option value="5">5 star</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div>
                            <label for="cafe-lat">Latitude</label>
                            <input type="number" id="cafe-lat" step="any" required> <!--- accepts non integer values-->
                        </div>
                        <div>
                            <label for="cafe-lng">Longitude</label>
                            <input type="number" id="cafe-lng" step="any" required>
                        </div>
                    </div>

                    <label for="cafe-notes">Notes</label>
                    <textarea id="cafe-notes" rows="3"></textarea>

                    <button type = "submit" class = "btn btn-dark">Add cafe</button>
                </form>
                <section id="cafe-list"></section>
            </div>
        </section>

        <!---footer-->
        <footer class="footer bg-lightish"> 
            <div class="container">
                <div class="footer-grid">
                    <div>
                        <a href="index.html"> <!---link-->
                            <img src="images/ccclogo.png" alt="logo">
                        </a>
                        <div class="card">
                            <h4 class="subscribe to newsletter"></h4>
                            <p class="text-sm">
                                get updated everytime I post a review!
                            </p>
                            <form> <!---understand with this does TODO-->
                                <input type="email" name="" id="email" placeholder="Enter your 
                                email">
                                <button type="submit" class="btn btn-primary 
                                btn-block">Subscribe</button>
                                
                            </form>
                        </div>
                        <i class="fab fa-linkedin"></i>
                        <i class="fab fa-spotify"></i>
                    </div>
                    <div>
                        <h4> Company </h4>
                        <ul>
                            <li><a href="#">About Us</a></li>
                            <li><a href="#">Our Process</a></li>
                            <li><a href="#">Join Our Team</a></li>
                        </ul>
                    </div>
                    
                    <div>
                        <h4> Resources </h4>
                        <ul>
                            <li><a href="#">About Us</a></li>
                            <li><a href="#">Our Process</a></li>
                            <li><a href="#">Join Our Team</a></li>
                        </ul>
                    </div>

                    <div>
                        <h4> Contact </h4>
                        <ul>
                            <li><a href="#">cavimathi08@gmail.com</a></li>
                        </ul>
                    </div>
                    
                </div>
            </div>
        </footer>
        <script src="main.js"></script>
    </body>
</html>
